name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared checks from https://github.com/Naresh1401/github-cicd-workflows
jobs:
  python:
    name: Python
    uses: Naresh1401/github-cicd-workflows/.github/workflows/python-ci.yml@v1
    with:
      install-command: python -m pip install -r backend/requirements.txt
      # The Playwright end-to-end tests need a browser and the running stack
      test-command: python -m pytest tests --ignore=tests/playwright

  node:
    name: Node
    uses: Naresh1401/github-cicd-workflows/.github/workflows/node-ci.yml@v1
    with:
      working-directory: frontend

  container:
    name: Docker image
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.backend
            context: .
          - dockerfile: Dockerfile.frontend
            context: .
    uses: Naresh1401/github-cicd-workflows/.github/workflows/container.yml@v1
    with:
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}

  repo-lint:
    name: Repository lint
    uses: Naresh1401/github-cicd-workflows/.github/workflows/repo-lint.yml@v1
